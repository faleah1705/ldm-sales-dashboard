aml
name: Build Static Dashboard
on:
  push:
    branches: [ main ] # Runs every time you push to main
  workflow_dispatch: # Allows you to trigger it manually via the UI

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install requests

      - name: Generate Dashboard File
        run: python generate_dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub

      - name: Upload Dashboard HTML as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-dashboard
          path: index.html
